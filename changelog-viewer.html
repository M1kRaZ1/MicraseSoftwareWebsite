<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Micrase's Assault changelog</title>
  <style>
    :root { font-family: "Trebuchet MS", "Lucida Grande", sans-serif; color: #263746; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; }
    h1 { margin: 0 0 16px; color: #365b75; font: bold 17px Georgia, "Times New Roman", serif; }
    h2 { margin: 16px 0 7px; padding-top: 12px; border-top: 1px solid #e1e6ea; color: #536c7c; font: bold 13px Georgia, "Times New Roman", serif; }
    h2:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
    ul { display: grid; gap: 5px; margin: 0; padding-left: 18px; }
    li, p { color: #687781; font-size: 12px; line-height: 1.5; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <div id="changelog-content"><p>Loading changelog…</p></div>
  <script>
    var content = document.querySelector("#changelog-content");
    var changelogs = {
      "micrase-assault": {
        file: "Changelog%20micrase%20assault.rtf",
        title: "Micrase's Assault"
      },
      "ur-local-ai": {
        file: "Changelog%20ur%20local%20ai.rtf",
        title: "Your Local AI"
      }
    };
    function getQueryParameter(name) {
      var query = window.location.search.replace(/^\?/, "").split("&");
      for (var index = 0; index < query.length; index += 1) {
        var pair = query[index].split("=");
        if (decodeURIComponent(pair[0].replace(/\+/g, " ")) === name) {
          return decodeURIComponent((pair.slice(1).join("=") || "").replace(/\+/g, " "));
        }
      }
      return null;
    }

    var requestedSoftware = getQueryParameter("software") || "micrase-assault";
    var changelog = changelogs[requestedSoftware];

    function decodeHexEscapes(value) {
      var windows1252 = {
        128: "\u20ac", 130: "\u201a", 131: "\u0192", 132: "\u201e", 133: "\u2026",
        134: "\u2020", 135: "\u2021", 136: "\u02c6", 137: "\u2030", 138: "\u0160",
        139: "\u2039", 140: "\u0152", 142: "\u017d", 145: "\u2018", 146: "\u2019",
        147: "\u201c", 148: "\u201d", 149: "\u2022", 150: "\u2013", 151: "\u2014",
        152: "\u02dc", 153: "\u2122", 154: "\u0161", 155: "\u203a", 156: "\u0153",
        158: "\u017e", 159: "\u0178"
      };
      return value.replace(/\\'([0-9a-f]{2})/gi, function (match, hex) {
        var byte = parseInt(hex, 16);
        return windows1252[byte] || String.fromCharCode(byte);
      });
    }

    function rtfToLines(rtf) {
      var contentStart = rtf.indexOf("\\cf0") + 5;
      var body = rtf.slice(contentStart).replace(/}\s*$/, "");
      return decodeHexEscapes(body)
        .replace(/\\par[d]?/gi, "\n")
        .replace(/\\\r?\n/g, "\n")
        .replace(/\\[a-z]+\d* ?/gi, "")
        .replace(/[{}]/g, "")
        .split(/\r?\n/)
        .map(function (line) { return line.trim(); })
        .filter(function (line) { return Boolean(line); });
    }

    function render(lines) {
      while (content.firstChild) content.removeChild(content.firstChild);
      var list;
      lines.forEach(function (line) {
        if (/^(Alpha|Version) /.test(line)) {
          list = null;
          var heading = document.createElement("h2");
          heading.textContent = line.replace(/;$/, "");
          content.appendChild(heading);
        } else if (line.indexOf("- ") === 0) {
          if (!list) {
            list = document.createElement("ul");
            content.appendChild(list);
          }
          var item = document.createElement("li");
          var text = line.slice(2);
          var urlPattern = /https?:\/\/[^\s)]+/g;
          var previousIndex = 0;
          var match;
          while ((match = urlPattern.exec(text))) {
            item.appendChild(document.createTextNode(text.slice(previousIndex, match.index)));
            var link = document.createElement("a");
            link.href = match[0];
            link.textContent = match[0];
            link.rel = "noopener noreferrer";
            item.appendChild(link);
            previousIndex = match.index + match[0].length;
          }
          item.appendChild(document.createTextNode(text.slice(previousIndex)));
          list.appendChild(item);
        } else if (line.indexOf("Changelog") !== -1) {
          var heading = document.createElement("h1");
          heading.textContent = line.replace(/^-+|-+$/g, "").trim();
          content.appendChild(heading);
        }
      });
    }

    if (!changelog) {
      content.innerHTML = '<p class="error">The changelog could not be loaded.</p>';
    } else {
      document.title = changelog.title + " changelog";
      var request = new XMLHttpRequest();
      request.open("GET", changelog.file, true);
      request.onreadystatechange = function () {
        if (request.readyState !== 4) return;
        if (request.status >= 200 && request.status < 300) {
          render(rtfToLines(request.responseText));
        } else {
          content.innerHTML = '<p class="error">The changelog could not be loaded.</p>';
        }
      };
      request.onerror = function () {
        content.innerHTML = '<p class="error">The changelog could not be loaded.</p>';
      };
      request.send();
    }
  </script>
</body>
</html>
