<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software | Micrase's softwares</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">Micrase's softwares</a>
      <span class="header-note">Software by Micrase1</span>
    </div>
  </header>

  <main class="wrap" id="software-detail" aria-live="polite"></main>

  <footer class="wrap site-footer">© Micrase1</footer>

  <script>
    const software = {
      "micrase-assault": {
        name: "Micrase's Assault",
        icon: "softicon_Micrase_Assault_game.webp",
        platforms: ["Linux", "macOS"],
        comingSoon: ["Android", "Windows"],
        downloads: {
          Linux: {
            note: "Alpha release: expect game-breaking bugs and glitches.",
            latest: {
              label: "Linux (AppImage)",
              url: "https://github.com/M1kRaZ1/MicraseSoftwareWebsite/releases/download/soft1/Micrase-Assault-Game-x86_64.AppImage"
            }
          },
          macOS: {
            note: "Alpha release: expect game-breaking bugs and glitches.",
            latest: {
              label: "Intel & Apple silicon (DMG)",
              url: "https://github.com/M1kRaZ1/MicraseSoftwareWebsite/releases/download/soft1/Micrases.Assault_Intel.AppleSilicon.dmg"
            }
          }
        }
      },
      "touch-grass": {
        name: "Touch Grass",
        icon: "softicon_touchgrass.webp",
        platforms: ["Android", "macOS"],
        downloads: {
          Android: {
            latest: {
              label: "Version 1.1 (APK)",
              url: "https://github.com/M1kRaZ1/MicraseSoftwareWebsite/releases/download/soft1/Touch-grass_v1.1.apk"
            },
            legacy: [{
              label: "Version 1.0 (APK)",
              url: "https://github.com/M1kRaZ1/MicraseSoftwareWebsite/releases/download/soft1/Touch_grass-V1.0.apk"
            }]
          },
          macOS: {
            latest: {
              label: "Intel & Apple silicon (DMG)",
              url: "https://github.com/M1kRaZ1/MicraseSoftwareWebsite/releases/download/soft1/Touch-Grass_Intel.AppleSilicon.dmg"
            }
          }
        }
      },
      "so-tuff": {
        name: "So Tuff",
        icon: "softicon_sotuff.webp",
        platforms: ["Android", "Linux", "Windows"],
        comingSoon: ["macOS"],
        downloads: {
          Android: {
            latest: {
              label: "Version 1.1 (APK)",
              url: "https://github.com/M1kRaZ1/MicraseSoftwareWebsite/releases/download/soft1/SO-TUFF-1.1.apk"
            },
            legacy: [{
              label: "Legacy release (APK)",
              url: "https://github.com/M1kRaZ1/MicraseSoftwareWebsite/releases/download/soft1/So-Tuff.apk"
            }]
          },
          Windows: {
            latest: {
              label: "Windows (ZIP)",
              url: "https://github.com/M1kRaZ1/MicraseSoftwareWebsite/releases/download/soft1/So-Tuff-win-x64.zip"
            }
          },
          Linux: {
            latest: {
              label: "Linux (AppImage)",
              url: "https://github.com/M1kRaZ1/MicraseSoftwareWebsite/releases/download/soft1/So-Tuff-x86_64.AppImage"
            }
          }
        }
      },
      "pigeon-weather": {
        name: "Pigeon Weather",
        icon: "softicon_pigeonweather.webp",
        platforms: ["Android"],
        downloads: {
          Android: {
            latest: {
              label: "Version 1.0.1 (APK)",
              url: "https://github.com/M1kRaZ1/MicraseSoftwareWebsite/releases/download/soft1/meteo-pigeon-app-release-1.0.1.apk"
            },
            legacy: [{
              label: "Version 1.0 (APK)",
              url: "https://github.com/M1kRaZ1/MicraseSoftwareWebsite/releases/download/soft1/meteo-pigeon-app-release-1.0.apk"
            }]
          }
        }
      }
    };

    const requestedSoftware = new URLSearchParams(window.location.search).get("software");
    const selectedSoftware = software[requestedSoftware];
    const detail = document.querySelector("#software-detail");

    if (!selectedSoftware) {
      document.title = "Software not found | Micrase's softwares";
      detail.innerHTML = '<a class="back-link" href="index.html">&larr; All software</a><section class="detail-panel not-found">Software not found.</section>';
    } else {
      document.title = `${selectedSoftware.name} | Micrase's softwares`;
      const initialPlatform = selectedSoftware.platforms[0];
      detail.innerHTML = `
        <a class="back-link" href="index.html">&larr; All software</a>
        <section class="detail-panel" aria-labelledby="software-name">
          <div class="detail-heading">
            <img class="software-icon app-icon" src="${selectedSoftware.icon}" alt="" aria-hidden="true">
            <div><h1 id="software-name">${selectedSoftware.name}</h1><p>Choose a platform</p></div>
          </div>
          <div class="platform-tabs" role="tablist" aria-label="Available platforms">
            ${["Android", "Linux", "macOS", "Windows"].map((platform, index) => `<button class="platform-tab" id="tab-${index}" type="button" role="tab" aria-selected="${platform === initialPlatform}" aria-controls="platform-content" tabindex="${platform === initialPlatform ? 0 : -1}" data-platform="${platform}">${platform}</button>`).join("")}
          </div>
          <div class="platform-content" id="platform-content" role="tabpanel" aria-labelledby="tab-${["Android", "Linux", "macOS", "Windows"].indexOf(initialPlatform)}"></div>
        </section>`;

      const tabs = [...detail.querySelectorAll("[role='tab']")];
      const content = detail.querySelector("[role='tabpanel']");

      function selectPlatform(tab) {
        const platform = tab.dataset.platform;
        const available = selectedSoftware.platforms.includes(platform);
        const comingSoon = selectedSoftware.comingSoon?.includes(platform);
        const releases = selectedSoftware.downloads?.[platform];
        tabs.forEach(item => {
          const active = item === tab;
          item.setAttribute("aria-selected", String(active));
          item.tabIndex = active ? 0 : -1;
        });
        content.setAttribute("aria-labelledby", tab.id);
        if (available && releases) {
          const legacyLinks = releases.legacy?.length
            ? `<details class="legacy-dropdown"><summary>Legacy releases</summary><div class="legacy-options">${releases.legacy.map(release => `<a href="${release.url}">${release.label}</a>`).join("")}</div></details>`
            : "";
          const releaseNote = releases.note ? `<p class="release-note">${releases.note}</p>` : "";
          content.innerHTML = `<h2>Available for ${platform}</h2>${releaseNote}<div class="download-actions"><a class="download-link" href="${releases.latest.url}">Download latest · ${releases.latest.label}</a>${legacyLinks}</div>`;
        } else {
          content.innerHTML = available
            ? `<h2>Available for ${platform}</h2><p>Downloads for this platform have not been added yet.</p>`
            : `<h2>${comingSoon ? `${platform} support coming soon` : `Not available for ${platform}`}</h2><p>${comingSoon ? `Support for ${platform} is coming soon.` : `${selectedSoftware.name} is not currently available for ${platform}.`}</p>`;
        }
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => selectPlatform(tab));
        tab.addEventListener("keydown", event => {
          if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
          event.preventDefault();
          const direction = event.key === "ArrowRight" ? 1 : -1;
          const nextTab = tabs[(index + direction + tabs.length) % tabs.length];
          nextTab.focus();
          selectPlatform(nextTab);
        });
      });
      selectPlatform(tabs.find(tab => tab.dataset.platform === initialPlatform));
    }
  </script>
</body>
</html>
